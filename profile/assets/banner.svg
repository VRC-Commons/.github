<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title description">
  <title id="title">VRC Commons · 社区共建计划</title>
  <desc id="description">深蓝背景上的 VRC Commons 标题与相互连接的圆形，表达社区成员共同建设。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102838"/>
      <stop offset="1" stop-color="#102027"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8AE9D2"/>
      <stop offset="1" stop-color="#B4D6FF"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="400" rx="24" fill="url(#background)"/>
  <g fill="none" stroke="#A8D9E7" stroke-opacity=".08">
    <path d="M0 80H1440M0 160H1440M0 240H1440M0 320H1440"/>
    <path d="M80 0V400M160 0V400M240 0V400M320 0V400M400 0V400M480 0V400M560 0V400M640 0V400M720 0V400M800 0V400M880 0V400M960 0V400M1040 0V400M1120 0V400M1200 0V400M1280 0V400M1360 0V400"/>
  </g>
  <rect x="72" y="74" width="42" height="5" rx="2.5" fill="#8AE9D2"/>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="72" y="185" font-size="78" font-weight="700" letter-spacing="-2" fill="#F2F8FA">VRC Commons</text>
    <text x="76" y="249" font-size="35" font-weight="500" letter-spacing="7" fill="#A8E6D7">社区共建计划</text>
    <text x="76" y="321" font-size="21" letter-spacing="1" fill="#A6BDC7">从一个想法开始，一起把它做好。</text>
  </g>
  <g transform="translate(1100 196)">
    <circle r="139" fill="none" stroke="#80CCBA" stroke-opacity=".1"/>
    <circle r="105" fill="none" stroke="#80CCBA" stroke-opacity=".15"/>
    <path d="M-87-48 87-48 0 102Z" fill="none" stroke="#8AE9D2" stroke-opacity=".32" stroke-width="2"/>
    <circle cx="-45" cy="-20" r="60" fill="#163C44" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="45" cy="-20" r="60" fill="#183646" fill-opacity=".72" stroke="url(#accent)" stroke-width="3"/>
    <circle cy="58" r="60" fill="#163B3C" fill-opacity=".72" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="-87" cy="-48" r="7" fill="#8AE9D2"/>
    <circle cx="87" cy="-48" r="7" fill="#B4D6FF"/>
    <circle cy="102" r="7" fill="#8AE9D2"/>
    <circle cx="120" cy="83" r="4" fill="#B4D6FF" fill-opacity=".65"/>
    <circle cx="-118" cy="73" r="4" fill="#8AE9D2" fill-opacity=".65"/>
